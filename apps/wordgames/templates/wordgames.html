<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}" />
  <meta name="theme-color" content="#1e2433" />
  <meta name="application-name" content="WordSprint" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WordSprint" />
  <link rel="manifest" href="{{ manifest_url }}?v={{ app_version }}" />
  <link rel="icon" type="image/svg+xml" href="{{ asset_url('brand/wordsprint-mark.svg') }}?v={{ app_version }}" />
  <link rel="icon" type="image/png" sizes="192x192" href="{{ asset_url('icons/icon-192.png') }}?v={{ app_version }}" />
  <link rel="apple-touch-icon" sizes="180x180" href="{{ asset_url('icons/apple-touch-icon.png') }}?v={{ app_version }}" />
  <link rel="stylesheet" href="{{ asset_url('wordgames.css') }}?v={{ app_version }}" />
</head>
  <body>
    <div id="app"></div>
    <script id="app-data" type="application/json">{{ app_data|tojson }}</script>
    <script src="{{ asset_url('wordgames-engagement.js') }}?v={{ app_version }}"></script>
    <script src="{{ asset_url('wordgames.js') }}?v={{ app_version }}"></script>
    <script>
      if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("{{ service_worker_url }}?v={{ app_version }}").catch(function () {});
      });
    }
  </script>
</body>
</html>
